<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: #111111 !important;
                font-family: sans-serif;
                font-weight: bold;
            }

            #display {
                width: 100%;
                height: 100%;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #111111 !important;
            }

            #display div {
                text-align: center;
                color: #ffffff;
            }

            #time {
                font-size: 35px;
            }

            #date {
                font-size: 15px;
                margin-top: 10px;
            }

            [data-state=undecided]{
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="display" data-state="undecided">
            <div>
                <div id="time"></div>
                <div id="date"></div>
            </div>
        </div>

        <script>
            // 🎵 Audio ottimizzato
            const audio = document.createElement("audio")
            audio.src = "media.mp3"   // niente timestamp
            audio.loop = true         // loop nativo
            audio.muted = true
            audio.autoplay = true
            document.body.appendChild(audio)

            // Sblocco audio al primo tocco
            const startMedia = () => {
                audio.muted = false
                document.removeEventListener("click", startMedia)
                document.removeEventListener("pointerdown", startMedia)
                document.removeEventListener("keydown", startMedia)
            }

            document.addEventListener("click", startMedia)
            document.addEventListener("pointerdown", startMedia)
            document.addEventListener("keydown", startMedia)

            // 🕒 Aggiornamento ora e data
            const timeEl = document.getElementById("time")
            const dateEl = document.getElementById("date")

            function updateDateTime() {
                const now = new Date()
                timeEl.textContent = now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })
                dateEl.textContent = now.toLocaleDateString("it-IT")
            }

            setInterval(updateDateTime, 1000)
            updateDateTime()

            // 🎨 Click → cambia colore
            document.addEventListener("click", () => {
                timeEl.style.color = "#ffc107"
                dateEl.style.color = "#ffc107"
            })
        </script>
    </body>
</html>
