<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: #111111 !important;
                font-family: sans-serif;
                font-weight: bold;
            }

            #display {
                width: 100%;
                height: 100%;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #111111 !important;
            }

            #display div {
                text-align: center;
                color: #ffffff;
            }

            #time {
                font-size: 64px;
            }

            #date {
                font-size: 28px;
                margin-top: 10px;
            }

            [data-state=undecided]{
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="display" data-state="undecided">
            <div>
                <div id="time"></div>
                <div id="date"></div>
            </div>
        </div>

        <script>
            const nowMedia = () => `media.mp3?q=${Date.now()}`

            const audio = document.createElement("audio")
            audio.controls = false
            audio.src = nowMedia()
            audio.muted = true
            audio.autoplay = true
            document.body.appendChild(audio)

            const listenEvents = ["keydown", "pointerdown", "click"]

            const addAllListeners = (listener) => {
                listenEvents.forEach(ev => {
                    document.addEventListener(ev, listener)
                });
            }

            const removeAllListeners = (listener) => {
                listenEvents.forEach(ev => {
                    document.removeEventListener(ev, listener)
                });
            }

            const reload = () => {
                audio.src = nowMedia()
                audio.currentTime = 0
                audio.play()
            }

            audio.onended = reload

            const startMedia = () => {
                reload()
                audio.muted = false
            }

            audio.onplaying = () => removeAllListeners(startMedia)

            addAllListeners(startMedia)

            const timeEl = document.getElementById("time")
            const dateEl = document.getElementById("date")

            // 🔥 Aggiorna ora e data
            function updateDateTime() {
                const now = new Date()
                timeEl.textContent = now.toLocaleTimeString("it-IT")
                dateEl.textContent = now.toLocaleDateString("it-IT")
            }

            setInterval(updateDateTime, 1000)
            updateDateTime()

            // 🔥 Click → cambia colore in #ffc107
            document.addEventListener("click", () => {
                timeEl.style.color = "#ffc107"
                dateEl.style.color = "#ffc107"
            })
        </script>
    </body>
</html>
